<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Gerador de Tokens Simples</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      padding: 30px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 20px 30px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    h1 {
      margin-top: 0;
    }

    label {
      font-weight: bold;
      margin-top: 20px;
      display: block;
    }

    input[type="file"], input[type="text"] {
      width: 100%;
      font-size: 16px;
      padding: 10px;
      margin-top: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      background: #0066cc;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 20px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 10px;
      font-size: 14px;
    }

    .error { color: #d32f2f; }
    .success { color: #2e7d32; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 25px;
    }

    th, td {
      border-bottom: 1px solid #e0e0e0;
      padding: 8px;
    }

    th {
      background: #f5f5f5;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<div class="container">
  <h1>Gerador de Tokens Simples</h1>
  <p>Token = 5 primeiros dígitos do hash + 5 dígitos de ID + Nome</p>

  <label>URL base do link</label>
  <input id="baseUrl" type="text" value="https://seusite.com/formulario.html"/>

  <label>Arquivo Excel ou CSV</label>
  <input id="fileInput" type="file" accept=".xlsx,.csv"/>

  <button id="generateBtn" disabled>Gerar Tokens</button>
  <button id="downloadBtn" disabled>Baixar CSV</button>

  <div id="status" class="status"></div>

  <div id="results"></div>
</div>

<script>
  const fileInput = document.getElementById("fileInput");
  const generateBtn = document.getElementById("generateBtn");
  const downloadBtn = document.getElementById("downloadBtn");
  const statusEl = document.getElementById("status");
  const resultsEl = document.getElementById("results");

  let rows = [];
  let outputRows = [];

  fileInput.addEventListener("change", () => {
    generateBtn.disabled = !fileInput.files.length;
    statusEl.textContent = "";
  });

  async function sha1(text) {
    const data = new TextEncoder().encode(text);
    const hash = await crypto.subtle.digest("SHA-1", data);
    return Array.from(new Uint8Array(hash))
      .map(b => b.toString(16).padStart(2, "0"))
      .join("");
  }

  function parseCSV(text) {
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    const header = lines[0].split(",").map(h => h.trim());
    const rows = [];

    for (let i = 1; i < lines.length; i++) {
      const cols = lines[i].split(",");
      const row = {};
      for (let j = 0; j < header.length; j++) {
        row[header[j]] = cols[j] ? cols[j].trim() : "";
      }
      rows.push(row);
    }
    return { header, rows };
  }

  function parseXLSX(buffer) {
    const wb = XLSX.read(buffer, { type: "array" });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(ws, { header: 1 });

    const header = json[0].map(x => String(x));
    const rows = [];

    for (let i = 1; i < json.length; i++) {
      if (!json[i]) continue;
      const obj = {};
      for (let j = 0; j < header.length; j++) {
        obj[header[j]] = json[i][j] ? String(json[i][j]) : "";
      }
      rows.push(obj);
    }

    return { header, rows };
  }


  generateBtn.addEventListener("click", async () => {
    const file = fileInput.files[0];

    if (!file) return;

    const baseUrl = document.getElementById("baseUrl").value.trim();
    if (!baseUrl) {
      statusEl.textContent = "Informe a URL base!";
      statusEl.className = "error status";
      return;
    }

    const reader = new FileReader();

    reader.onload = async e => {
      let parsed;

      if (/\.csv$/i.test(file.name)) {
        parsed = parseCSV(e.target.result);
      } else {
        parsed = parseXLSX(e.target.result);
      }

      const { header, rows: fileRows } = parsed;

      if (!header.includes("Nome")) {
        statusEl.textContent = "A coluna 'Nome' é obrigatória!";
        statusEl.className = "error status";
        return;
      }

      const hasID = header.includes("ID");

      outputRows = [];

      for (const row of fileRows) {
        const nome = row["Nome"] || "";
        let id = row["ID"] || "";

        if (!id) {
          id = String(Math.floor(Math.random() * 100000)).padStart(5, "0");
        } else {
          id = String(id).padStart(5, "0");
        }

        const core = `${id}&${nome}`;
        const h = await sha1(core);
        const hash5 = h.substring(0, 5);

        const token = `${hash5}&${id}&${nome}`;
        const link = `${baseUrl}?token=${encodeURIComponent(token)}`;

        outputRows.push({
          Nome: nome,
          ID: id,
          Token: token,
          Link: link
        });
      }

      statusEl.textContent = "Tokens gerados com sucesso!";
      statusEl.className = "success status";
      downloadBtn.disabled = false;

      renderTable(outputRows.slice(0, 20));
    };

    reader.readAsBinaryString ? reader.readAsBinaryString(file) : reader.readAsArrayBuffer(file);
  });

  function renderTable(rows) {
    let html = "<table><tr><th>ID</th><th>Nome</th><th>Token</th><th>Link</th></tr>";
    rows.forEach(r => {
      html += `<tr>
        <td>${r.ID}</td>
        <td>${r.Nome}</td>
        <td>${r.Token}</td>
        <td><a href="${r.Link}" target="_blank">${r.Link}</a></td>
      </tr>`;
    });
    html += "</table>";
    resultsEl.innerHTML = html;
  }

  downloadBtn.addEventListener("click", () => {
    let csv = "ID,Nome,Token,Link\n";
    outputRows.forEach(r => {
      csv += `"${r.ID}","${r.Nome}","${r.Token}","${r.Link}"\n`;
    });

    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "tokens.csv";
    a.click();
    URL.revokeObjectURL(url);
  });
</script>

</body>
</html>
