<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Gerador de Links NPS em Massa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f0f4f8;
      color: #091c28;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 1.6rem;
    }

    p {
      margin: 0 0 12px;
    }

    label {
      display: block;
      font-weight: 600;
      margin: 16px 0 6px;
    }

    input[type="file"],
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 2px solid #e0e7f0;
      font-size: 0.95rem;
      font-family: inherit;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #0066b3;
      box-shadow: 0 0 0 3px rgba(0,102,179,0.12);
    }

    .actions {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      padding: 10px 18px;
      border-radius: 999px;
      border: none;
      background: #0066b3;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      font-family: inherit;
      transition: all 150ms ease;
    }

    button[disabled] {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    button:hover:not([disabled]) {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0,102,179,0.25);
    }

    button.secondary {
      background: #e6eef7;
      color: #0066b3;
    }

    .status {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #555;
    }

    .status.error {
      color: #b3261e;
    }

    .status.success {
      color: #0d652d;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      font-size: 0.85rem;
    }

    th, td {
      padding: 8px 10px;
      border-bottom: 1px solid #e1e7ef;
      text-align: left;
      vertical-align: top;
      word-break: break-word;
    }

    th {
      background: #f5f7fb;
      font-weight: 600;
    }

    .small {
      font-size: 0.8rem;
      color: #666;
    }

    @media (max-width: 640px) {
      .container {
        padding: 16px;
      }
      table {
        font-size: 0.8rem;
      }
    }
  </style>

  <!-- XLSX para ler Excel no navegador -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>Gerador de Links NPS em Massa</h1>
    <p class="small">
      Envie um arquivo <strong>Excel (.xlsx)</strong> ou <strong>CSV</strong> com as colunas:<br>
      <code>EMPRESA, Nome, EMAIL, Status, LINK, RecomendarServico, MotivoDaNota, ComentAdicional, TELEFONE</code>.
    </p>

    <label for="baseUrl">URL base da pesquisa</label>
    <input
      type="text"
      id="baseUrl"
      value="https://seusite.com/npscanais.html"
      placeholder="Ex: https://seusite.com/npscanais.html"
    />

    <label for="fileInput">Arquivo (.xlsx ou .csv)</label>
    <input type="file" id="fileInput" accept=".xlsx,.csv" />

    <div class="small">
      • Para CSV, delimitador pode ser vírgula <code>,</code> ou ponto e vírgula <code>;</code>.<br>
      • A primeira linha deve conter o cabeçalho.
    </div>

    <div class="actions">
      <button id="generateBtn" disabled>Gerar tokens e links</button>
      <button id="downloadBtn" class="secondary" disabled>Baixar CSV com links</button>
    </div>

    <div id="status" class="status"></div>

    <div id="results"></div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const baseUrlInput = document.getElementById('baseUrl');
    const generateBtn = document.getElementById('generateBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const statusEl = document.getElementById('status');
    const resultsEl = document.getElementById('results');

    let rowsOriginal = [];    // linhas completas do arquivo
    let rowsWithLinks = [];   // linhas com Token + LinkGerado

    // Normaliza nomes de coluna (tira aspas e espaços extras)
    function normalizeHeaderName(name) {
      return name.trim().replace(/^"|"$/g, '').toUpperCase();
    }

    // Leitor de CSV simples
    function detectDelimiter(headerLine) {
      if (headerLine.indexOf(';') !== -1 && headerLine.indexOf(',') === -1) return ';';
      if (headerLine.indexOf(',') !== -1 && headerLine.indexOf(';') === -1) return ',';
      return ','; // padrão
    }

    function parseCSV(text) {
      const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
      if (lines.length === 0) return [];

      const delimiter = detectDelimiter(lines[0]);
      const headerRaw = lines[0].split(delimiter);
      const headerNorm = headerRaw.map(normalizeHeaderName);

      const dataRows = [];
      for (let i = 1; i < lines.length; i++) {
        const line = lines[i];
        if (!line.trim()) continue;
        const cols = line.split(delimiter);
        const rowObj = {};
        for (let c = 0; c < headerRaw.length; c++) {
          const rawName = headerRaw[c].trim().replace(/^"|"$/g, '');
          rowObj[rawName] = (cols[c] || '').trim().replace(/^"|"$/g, '');
        }
        dataRows.push(rowObj);
      }
      return { header: headerRaw.map(h => h.trim().replace(/^"|"$/g, '')), rows: dataRows };
    }

    // Leitor de Excel via XLSX
    function parseXLSX(arrayBuffer) {
      const data = new Uint8Array(arrayBuffer);
      const workbook = XLSX.read(data, { type: 'array' });

      const sheetName = workbook.SheetNames[0]; // primeira aba
      const worksheet = workbook.Sheets[sheetName];

      // header: 1 → primeira linha é cabeçalho, raw: true para não mexer muito em tipos
      const json = XLSX.utils.sheet_to_json(worksheet, { header: 1, raw: true });
      if (json.length === 0) return { header: [], rows: [] };

      const headerRaw = json[0].map(h => (h != null ? String(h) : ''));
      const rows = [];

      for (let i = 1; i < json.length; i++) {
        const rowArr = json[i];
        if (!rowArr || rowArr.every(v => (v == null || String(v).trim() === ''))) continue;

        const obj = {};
        for (let c = 0; c < headerRaw.length; c++) {
          const key = headerRaw[c].trim().replace(/^"|"$/g, '');
          const cellVal = rowArr[c];
          obj[key] = cellVal == null ? '' : String(cellVal);
        }
        rows.push(obj);
      }

      return { header: headerRaw.map(h => h.trim().replace(/^"|"$/g, '')), rows };
    }

    fileInput.addEventListener('change', () => {
      rowsOriginal = [];
      rowsWithLinks = [];
      resultsEl.innerHTML = '';
      downloadBtn.disabled = true;

      if (fileInput.files && fileInput.files.length > 0) {
        generateBtn.disabled = false;
        statusEl.textContent = 'Arquivo selecionado. Clique em "Gerar tokens e links".';
        statusEl.className = 'status';
      } else {
        generateBtn.disabled = true;
        statusEl.textContent = '';
      }
    });

    // Mini-hash SHA-1 abreviado (5 dígitos hex)
    async function hash5(text) {
      const enc = new TextEncoder();
      const data = enc.encode(text);
      const buffer = await crypto.subtle.digest('SHA-1', data);
      const arr = Array.from(new Uint8Array(buffer));
      const hex = arr.map(b => b.toString(16).padStart(2, '0')).join('');
      return hex.substring(0, 5);
    }

    // Gera token com a lógica:
    // token = hash5 + '&' + TELEFONE + '&' + Nome + '&' + EMPRESA
    async function generateToken(telefone, nome, empresa) {
      // Evitar & dentro dos campos (substitui por espaço)
      const telSafe = (telefone || '').replace(/&/g, ' ');
      const nomeSafe = (nome || '').replace(/&/g, ' ');
      const empSafe  = (empresa || '').replace(/&/g, ' ');

      const corpo = `${telSafe}&${nomeSafe}&${empSafe}`;
      const h = await hash5(corpo);
      return `${h}&${corpo}`;
    }

    function buildCSVOutput(headers, rows) {
      // Garante que Token e LinkGerado entrem no fim
      const extraHeaders = ['Token', 'LinkGerado'];
      const fullHeader = [...headers];

      extraHeaders.forEach(h => {
        if (!fullHeader.includes(h)) {
          fullHeader.push(h);
        }
      });

      const lines = [fullHeader.join(',')];

      for (const row of rows) {
        const cols = fullHeader.map(h => {
          const val = row[h] != null ? String(row[h]) : '';
          return `"${val.replace(/"/g, '""')}"`;
        });
        lines.push(cols.join(','));
      }

      return lines.join('\r\n');
    }

    function showResultsTable(rows) {
      if (!rows || rows.length === 0) {
        resultsEl.innerHTML = '';
        return;
      }

      const maxPreview = 20;
      const preview = rows.slice(0, maxPreview);

      let html = '<table><thead><tr><th>EMPRESA</th><th>Nome</th><th>TELEFONE</th><th>Token</th><th>Link gerado</th></tr></thead><tbody>';

      for (const row of preview) {
        html += `<tr>
          <td>${row.EMPRESA || row.Empresa || ''}</td>
          <td>${row.Nome || ''}</td>
          <td>${row.TELEFONE || ''}</td>
          <td>${row.Token || ''}</td>
          <td><a href="${row.LinkGerado || '#'}" target="_blank" rel="noopener noreferrer">${row.LinkGerado || ''}</a></td>
        </tr>`;
      }

      html += '</tbody></table>';

      if (rows.length > maxPreview) {
        html += `<p class="small">Mostrando ${maxPreview} de ${rows.length} registros. Baixe o CSV para ver todos.</p>`;
      }

      resultsEl.innerHTML = html;
    }

    generateBtn.addEventListener('click', () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) {
        statusEl.textContent = 'Nenhum arquivo selecionado.';
        statusEl.className = 'status error';
        return;
      }

      const baseUrl = baseUrlInput.value.trim();
      if (!baseUrl) {
        statusEl.textContent = 'Informe a URL base da pesquisa.';
        statusEl.className = 'status error';
        return;
      }

      const isCSV = /\.csv$/i.test(file.name);
      const isXLSX = /\.xlsx$/i.test(file.name);

      if (!isCSV && !isXLSX) {
        statusEl.textContent = 'Tipo de arquivo não suportado. Use .xlsx ou .csv.';
        statusEl.className = 'status error';
        return;
      }

      const reader = new FileReader();

      reader.onload = async (e) => {
        try {
          let parsed;
          if (isCSV) {
            parsed = parseCSV(e.target.result);
          } else {
            parsed = parseXLSX(e.target.result);
          }

          const { header, rows } = parsed;

          if (!header || header.length === 0) {
            statusEl.textContent = 'Cabeçalho não encontrado no arquivo.';
            statusEl.className = 'status error';
            return;
          }

          if (!rows || rows.length === 0) {
            statusEl.textContent = 'Nenhuma linha de dados encontrada.';
            statusEl.className = 'status error';
            return;
          }

          // Mapear nomes de coluna (case-insensitive)
          const headerNorm = header.map(normalizeHeaderName);

          function findColIndex(target) {
            const targetUp = target.toUpperCase();
            return headerNorm.findIndex(h => h === targetUp || h.includes(targetUp));
          }

          const idxEmpresa  = findColIndex('EMPRESA');
          const idxNome     = findColIndex('NOME');
          const idxTelefone = findColIndex('TELEFONE');

          if (idxEmpresa === -1 || idxNome === -1 || idxTelefone === -1) {
            statusEl.textContent = 'Não encontrei colunas EMPRESA, Nome e TELEFONE no arquivo.';
            statusEl.className = 'status error';
            return;
          }

          const colEmpresa  = header[idxEmpresa];
          const colNome     = header[idxNome];
          const colTelefone = header[idxTelefone];

          rowsOriginal = rows;
          rowsWithLinks = [];

          statusEl.textContent = 'Gerando tokens e links...';
          statusEl.className = 'status';

          for (const row of rowsOriginal) {
            const empresa  = row[colEmpresa]  != null ? String(row[colEmpresa])  : '';
            const nome     = row[colNome]     != null ? String(row[colNome])     : '';
            const telefone = row[colTelefone] != null ? String(row[colTelefone]) : '';

            // clonar linha original
            const newRow = { ...row };

            const token = await generateToken(telefone, nome, empresa);
            const link  = `${baseUrl}?token=${encodeURIComponent(token)}`;

            newRow.Token = token;
            newRow.LinkGerado = link;

            // Também garantir EMPRESA / Nome / TELEFONE com essas chaves "bonitinhas"
            if (!newRow.EMPRESA) newRow.EMPRESA = empresa;
            if (!newRow.Nome)    newRow.Nome = nome;
            if (!newRow.TELEFONE) newRow.TELEFONE = telefone;

            rowsWithLinks.push(newRow);
          }

          showResultsTable(rowsWithLinks);
          downloadBtn.disabled = false;

          statusEl.textContent = `Tokens e links gerados com sucesso: ${rowsWithLinks.length} registros.`;
          statusEl.className = 'status success';

        } catch (err) {
          console.error(err);
          statusEl.textContent = 'Erro ao processar o arquivo: ' + err.message;
          statusEl.className = 'status error';
          rowsOriginal = [];
          rowsWithLinks = [];
          resultsEl.innerHTML = '';
          downloadBtn.disabled = true;
        }
      };

      reader.onerror = () => {
        statusEl.textContent = 'Erro ao ler o arquivo.';
        statusEl.className = 'status error';
      };

      if (isCSV) {
        reader.readAsText(file, 'utf-8');
      } else {
        reader.readAsArrayBuffer(file);
      }
    });

    downloadBtn.addEventListener('click', () => {
      if (!rowsWithLinks || rowsWithLinks.length === 0) return;

      const allHeadersSet = new Set();
      rowsWithLinks.forEach(row => {
        Object.keys(row).forEach(k => allHeadersSet.add(k));
      });
      const headers = Array.from(allHeadersSet);

      const csvOut = buildCSVOutput(headers, rowsWithLinks);
      const blob = new Blob([csvOut], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = 'links_nps_gerados.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
