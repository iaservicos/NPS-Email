<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Gerador de Tokens Simples</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      padding: 30px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 20px 30px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    h1 {
      margin-top: 0;
    }

    label {
      font-weight: bold;
      margin-top: 20px;
      display: block;
    }

    input[type="file"], input[type="text"] {
      width: 100%;
      font-size: 16px;
      padding: 10px;
      margin-top: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      background: #0066cc;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 20px;
      margin-right: 8px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 10px;
      font-size: 14px;
    }

    .error { color: #d32f2f; }
    .success { color: #2e7d32; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 25px;
    }

    th, td {
      border-bottom: 1px solid #e0e0e0;
      padding: 8px;
    }

    th {
      background: #f5f5f5;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<div class="container">
  <h1>Gerador de Tokens Simples</h1>
  <p>Token = 5 primeiros dígitos do hash + 5 dígitos de ID + Nome</p>

  <label>URL base do link</label>
  <input id="baseUrl" type="text" value="https://npspositivo.site/npscanais.html"/>

  <label>Arquivo Excel ou CSV</label>
  <input id="fileInput" type="file" accept=".xlsx,.csv"/>

  <button id="generateBtn" disabled>Gerar Tokens</button>
  <button id="downloadBtn" disabled>Baixar CSV</button>

  <div id="status" class="status"></div>

  <div id="results"></div>
</div>

<script>
  const fileInput   = document.getElementById("fileInput");
  const generateBtn = document.getElementById("generateBtn");
  const downloadBtn = document.getElementById("downloadBtn");
  const statusEl    = document.getElementById("status");
  const resultsEl   = document.getElementById("results");

  let outputRows = [];

  // Normaliza nomes de cabeçalho (tira BOM, espaços, acentos/caracteres estranhos)
  function normHeader(name) {
    return String(name || "")
      .replace(/\uFEFF/g, "")
      .trim()
      .toUpperCase()
      .replace(/[^A-Z0-9]/g, ""); // fica tipo NOME, ID, EMPRESA
  }

  fileInput.addEventListener("change", () => {
    generateBtn.disabled = !fileInput.files.length;
    downloadBtn.disabled = true;
    statusEl.textContent = "";
    resultsEl.innerHTML = "";
    outputRows = [];
  });

  async function sha1(text) {
    const data = new TextEncoder().encode(text);
    const hash = await crypto.subtle.digest("SHA-1", data);
    return Array.from(new Uint8Array(hash))
      .map(b => b.toString(16).padStart(2, "0"))
      .join("");
  }

  function parseCSV(text) {
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    if (!lines.length) return { header: [], rows: [] };

    // deteção simples de delimitador
    const first = lines[0];
    let delim = ",";
    if (first.indexOf(";") !== -1 && first.indexOf(",") === -1) delim = ";";

    const header = first.split(delim).map(h => h.trim().replace(/^"|"$/g, ""));
    const rows   = [];

    for (let i = 1; i < lines.length; i++) {
      const cols = lines[i].split(delim);
      if (!cols.length) continue;
      const row = {};
      for (let j = 0; j < header.length; j++) {
        row[header[j]] = cols[j] ? cols[j].trim().replace(/^"|"$/g, "") : "";
      }
      rows.push(row);
    }
    return { header, rows };
  }

  function parseXLSX(buffer) {
    const wb = XLSX.read(buffer, { type: "array" });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(ws, { header: 1 });

    if (!json.length) return { header: [], rows: [] };

    const header = json[0].map(x => x != null ? String(x) : "");
    const rows   = [];

    for (let i = 1; i < json.length; i++) {
      const arr = json[i];
      if (!arr || arr.every(v => v == null || String(v).trim() === "")) continue;
      const obj = {};
      for (let j = 0; j < header.length; j++) {
        obj[header[j]] = arr[j] != null ? String(arr[j]) : "";
      }
      rows.push(obj);
    }
    return { header, rows };
  }

  generateBtn.addEventListener("click", () => {
    const file = fileInput.files[0];
    if (!file) return;

    const baseUrl = document.getElementById("baseUrl").value.trim();
    if (!baseUrl) {
      statusEl.textContent = "Informe a URL base!";
      statusEl.className = "error status";
      return;
    }

    const reader = new FileReader();

    reader.onload = async e => {
      let parsed;
      if (/\.csv$/i.test(file.name)) {
        parsed = parseCSV(e.target.result);
      } else {
        parsed = parseXLSX(e.target.result);
      }

      const { header, rows } = parsed;

      if (!header.length) {
        statusEl.textContent = "Cabeçalho não encontrado no arquivo.";
        statusEl.className = "error status";
        return;
      }

      if (!rows.length) {
        statusEl.textContent = "Nenhuma linha de dados encontrada.";
        statusEl.className = "error status";
        return;
      }

      const headerNorm = header.map(normHeader);
      console.log("Header bruto:", header);
      console.log("Header normalizado:", headerNorm);

      const idxNome = headerNorm.findIndex(h => h === "NOME");
      if (idxNome === -1) {
        statusEl.textContent = "Não encontrei a coluna 'Nome' (NOME/Nome) no arquivo.";
        statusEl.className = "error status";
        return;
      }
      const colNome = header[idxNome];

      const idxID = headerNorm.findIndex(h => h === "ID");
      const colID = idxID !== -1 ? header[idxID] : null;

      outputRows = [];

      for (const row of rows) {
        const nomeRaw = row[colNome] != null ? String(row[colNome]) : "";
        const nome = nomeRaw.trim();

        if (!nome) continue; // pula linhas sem nome

        let idVal = colID ? (row[colID] != null ? String(row[colID]) : "") : "";
        idVal = idVal.trim();

        if (!idVal) {
          idVal = String(Math.floor(Math.random() * 100000)).padStart(5, "0");
        } else {
          idVal = idVal.padStart(5, "0").slice(-5);
        }

        const core = `${idVal}&${nome}`;
        const fullHash = await sha1(core);
        const hash5 = fullHash.substring(0, 5);

        const token = `${hash5}&${idVal}&${nome}`;
        const link  = `${baseUrl}?token=${encodeURIComponent(token)}`;

        outputRows.push({
          ID: idVal,
          Nome: nome,
          Token: token,
          Link: link
        });
      }

      if (!outputRows.length) {
        statusEl.textContent = "Nenhuma linha válida (com Nome) encontrada.";
        statusEl.className = "error status";
        return;
      }

      statusEl.textContent = "Tokens gerados com sucesso!";
      statusEl.className = "success status";
      downloadBtn.disabled = false;

      renderTable(outputRows.slice(0, 20));
    };

    if (/\.csv$/i.test(file.name)) {
      reader.readAsText(file, "utf-8");
    } else {
      reader.readAsArrayBuffer(file);
    }
  });

  function renderTable(rows) {
    let html = "<table><tr><th>ID</th><th>Nome</th><th>Token</th><th>Link</th></tr>";
    rows.forEach(r => {
      html += `<tr>
        <td>${r.ID}</td>
        <td>${r.Nome}</td>
        <td>${r.Token}</td>
        <td><a href="${r.Link}" target="_blank">${r.Link}</a></td>
      </tr>`;
    });
    html += "</table>";
    resultsEl.innerHTML = html;
  }

  downloadBtn.addEventListener("click", () => {
    if (!outputRows.length) return;
    let csv = "ID,Nome,Token,Link\n";
    outputRows.forEach(r => {
      csv += `"${r.ID}","${r.Nome.replace(/"/g,'""')}","${r.Token}","${r.Link}"\n`;
    });

    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "tokens.csv";
    a.click();
    URL.revokeObjectURL(url);
  });
</script>

</body>
</html>
